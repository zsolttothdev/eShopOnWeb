# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - eShopOnWeb1

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

#      - name: Build with dotnet
#        run: dotnet build "./src/Web/Web.csproj" --configuration Release

      - name: dotnet publish
        run: dotnet publish "./src/Web/Web.csproj" -c Release -o "./src/Web/Release"

      - name: List publish output
        run: dir "./src/Web/Release"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./src/Web/Release

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D8017F18247A404BB299B9D4FE383658 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FB42EEF51F4045C49E5A3BD87C595FE1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_11BD281F901244BBAB10A4B90B1F5F77 }}

      - name: Show deployment files
        shell: powershell
        run: |
          Write-Host "CURRENT DIRECTORY:"
          Get-Location
          Write-Host "FILES:"
          Get-ChildItem ./publish -File | Select-Object Name

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eShopOnWeb1'
          slot-name: 'Production'
          package: ./publish
          