# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - eShopPublicApi

on:
  push:
    branches:
      - 'monitoring-logging'
  workflow_dispatch:


jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install Application Insights NuGet package
        run: dotnet add "./src/PublicApi/PublicApi.csproj" package Microsoft.ApplicationInsights.AspNetCore
        
#      - name: Build with dotnet
#        run: dotnet build "./src/PublicApi/PublicApi.csproj" --configuration Release

      - name: dotnet publish
        run: dotnet publish "./src/PublicApi/PublicApi.csproj" -c Release -o "./src/PublicApi/Release"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./src/PublicApi/Release

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0A0BB0EEF01347A6BDDED884E72102F8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_37C6445A3CFE463EA12643117D36F479 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B20B0BC5E7DB4FC2B049B970077EFCDF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eShopPublicApi'
          slot-name: 'Production'
          package: ./publish
          