# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - eShopPublicApi

on:
  push:
    branches:
      - 'key-vault'
  workflow_dispatch:


jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

#      - name: Build with dotnet
#        run: dotnet build "./src/PublicApi/PublicApi.csproj" --configuration Release

      - name: dotnet publish
        run: dotnet publish "./src/PublicApi/PublicApi.csproj" -c Release -o "./src/PublicApi/Release"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./src/PublicApi/Release

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_94A61642C97F4A9A90DEFEB4C5B02416 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C3DCADDCAB444CF5A5AD93955A080A2B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A034246C0847451EB9E91AA902A285AC }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eShopPublicApi'
          slot-name: 'Production'
          package: ./publish
          